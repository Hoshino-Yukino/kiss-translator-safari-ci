name: Safari iOS → TestFlight

# 每天检查一次上游 release：
#   - 上游有新版本 → 构建并上传
#   - 距离上次上传已满 REFRESH_DAYS 天 → 重新构建上传，避免 TestFlight 构建 90 天过期
#   - 手动运行时可勾选 force 强制构建
on:
  schedule:
    - cron: '17 21 * * *'   # UTC 21:17 = 日本时间 06:17
  workflow_dispatch:
    inputs:
      force:
        description: '强制构建并上传'
        type: boolean
        default: false

permissions:
  contents: write   # 提交 .state/ 记录
  actions: write    # keepalive：重新启用本 workflow

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  UPSTREAM: fishjar/kiss-translator
  REFRESH_DAYS: '60'          # TestFlight 构建 90 天过期，留出余量
  WORKFLOW_FILE: testflight.yml   # 本文件的文件名，改名时同步修改

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Keepalive（防止公开仓库 60 天无活动后定时任务被停用）
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/enable"

      - name: Decide whether to build
        id: decide
        run: |
          tag=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          last_tag=$(cat .state/last-built 2>/dev/null || true)
          last_upload=$(cat .state/last-upload 2>/dev/null || echo 0)
          age_days=$(( ( $(date +%s) - last_upload ) / 86400 ))

          build=false
          reason="上游 ${tag} 已构建，距上次上传 ${age_days} 天，无需构建"
          if [ "${{ inputs.force }}" = "true" ]; then
            build=true; reason="手动强制构建"
          elif [ "$tag" != "$last_tag" ]; then
            build=true; reason="上游新版本 ${tag}（上次构建：${last_tag:-无}）"
          elif [ "$age_days" -ge "$REFRESH_DAYS" ]; then
            build=true; reason="距上次上传已 ${age_days} 天，刷新 TestFlight 构建"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "### ${reason}" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    # App Store Connect 要求 iOS 26 SDK（Xcode 26）；macos-15 默认仍是 Xcode 16.4
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 不需要 macOS 版本时，删掉 macOS 这一行即可
        platform: [iOS, macOS]
    name: build (${{ matrix.platform }})
    env:
      PLATFORM: ${{ matrix.platform }}
      TAG: ${{ needs.check.outputs.tag }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          [ -n "$BUNDLE_ID" ]     || missing="$missing BUNDLE_ID(variable)"
          [ -n "$TEAM_ID" ]       || missing="$missing APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ]    || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          [ -n "${{ secrets.DEV_CERT_P12_BASE64 }}" ] || missing="$missing DEV_CERT_P12_BASE64"
          [ -n "${{ secrets.DEV_CERT_PASSWORD }}" ]   || missing="$missing DEV_CERT_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少配置:$missing"; exit 1
          fi

      - uses: actions/checkout@v5

      - name: Checkout upstream ${{ env.TAG }}
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.TAG }}
          path: upstream

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm & dependencies
        working-directory: upstream
        run: |
          npm install -g "pnpm@$(cat .pnpm-version)"
          pnpm install --frozen-lockfile

      - name: Patch bundle id & team
        working-directory: upstream
        run: |
          script=src/scripts/build-safari.mjs
          if ! grep -q 'com\.fishjar\.kiss-translator' "$script"; then
            echo "::error::上游构建脚本已变更，找不到默认 Bundle ID，请检查 $script"; exit 1
          fi
          sed -i '' "s/com\.fishjar\.kiss-translator/${BUNDLE_ID}/" "$script"
          echo "DEVELOPMENT_TEAM=${TEAM_ID}" > .env.local

          # 上游用 "Kiss Translator" 区分大小写匹配 CFBundleDisplayName，而生成的是 "KISS Translator"，
          # 导致 LSApplicationCategoryType / ITSAppUsesNonExemptEncryption 没有注入（macOS 上传校验必需）。
          # 把这个正则改成不区分大小写。
          grep -q '^      "g"$' "$script" || { echo "::error::上游构建脚本已变更，找不到 displayNameRegex 的 flag，请检查 $script"; exit 1; }
          sed -i '' 's/^      "g"$/      "gi"/' "$script"

          # Safari 扩展上传校验要求 manifest 的 description（app_description）不超过 112 个字符
          node -e '
            const fs = require("fs");
            for (const f of process.argv.slice(1)) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              const d = j.app_description;
              if (!d || [...d.message].length <= 112) continue;
              let s = [...d.message].slice(0, 111).join("");
              const sp = s.lastIndexOf(" ");
              if (sp > 80) s = s.slice(0, sp);
              d.message = s.replace(/[\s,.;:，、。]+$/, "") + "…";
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
              console.log(`${f}: app_description 截断为 ${[...d.message].length} 个字符`);
            }
          ' public/_locales/*/messages.json

      - name: Build Xcode project
        working-directory: upstream
        env:
          CI: 'false'   # react-scripts 在 CI=true 时会把 lint 警告当成错误
        run: pnpm build:safari

      # safari-web-extension-converter 并不直接使用 --bundle-identifier：
      # 它取前缀 + App 名生成 "online.swqh.KISS-Translator"，与 App Store Connect 里的
      # App 记录（BUNDLE_ID，区分大小写）对不上，导出时报 "Error Downloading App Information"。
      # 这里把生成的 Bundle ID 统一替换成 BUNDLE_ID（含扩展 .Extension 和 Swift 代码里的引用）。
      - name: Use BUNDLE_ID in generated project
        run: |
          proj=$(find upstream/build -maxdepth 2 -name '*.xcodeproj' | head -1)
          pbx="$proj/project.pbxproj"
          ids() { grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$pbx" | sed -E 's/.* = "?([^";]*)"?;/\1/' | sort -u; }
          generated=$(ids | grep -v '\.Extension$' || true)
          if [ "$(printf '%s\n' "$generated" | grep -c .)" -ne 1 ]; then
            ids; echo "::error::无法确定生成的 App Bundle ID"; exit 1
          fi
          if [ "$generated" != "$BUNDLE_ID" ]; then
            echo "替换 Bundle ID: $generated → $BUNDLE_ID"
            grep -rlF "$generated" "$(dirname "$proj")" | while IFS= read -r f; do
              sed -i '' "s/${generated//./\\.}/${BUNDLE_ID}/g" "$f"
              echo "  $f"
            done
          fi
          echo "工程中的 Bundle ID："; ids
          bad=$(ids | grep -vxF -e "$BUNDLE_ID" -e "${BUNDLE_ID}.Extension" || true)
          [ -z "$bad" ] || { echo "::error::仍有不匹配的 Bundle ID: $bad"; exit 1; }
          grep -q 'INFOPLIST_KEY_LSApplicationCategoryType' "$pbx" || { echo "::error::工程中缺少 LSApplicationCategoryType"; exit 1; }

      # 用仓库里的 assets/AppIcon-*.png 替换转换器生成的 App 图标（iOS 与 macOS 共用 AppIcon）
      - name: Set app icon
        run: |
          proj=$(find upstream/build -maxdepth 2 -name '*.xcodeproj' | head -1)
          sets=$(find "$(dirname "$proj")" -type d -path '*.xcassets/AppIcon.appiconset')
          [ -n "$sets" ] || { echo "::error::找不到 AppIcon.appiconset"; exit 1; }
          printf '%s\n' "$sets" | while IFS= read -r set; do
            echo "== $set"
            rm -f "$set"/*.png
            cp assets/AppIcon-iOS.png "$set/icon-ios-1024.png"
            images='{"filename":"icon-ios-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}'
            for s in 16 32 128 256 512; do
              for scale in 1 2; do
                px=$((s * scale)); f="icon-mac-${s}@${scale}x.png"
                sips -z "$px" "$px" assets/AppIcon-macOS.png --out "$set/$f" > /dev/null
                images="$images,{\"filename\":\"$f\",\"idiom\":\"mac\",\"scale\":\"${scale}x\",\"size\":\"${s}x${s}\"}"
              done
            done
            printf '{"images":[%s],"info":{"author":"xcode","version":1}}' "$images" | jq . > "$set/Contents.json"
            ls "$set"
          done

      - name: Prepare signing key & project info
        run: |
          key_dir="$RUNNER_TEMP/asc"
          mkdir -p "$key_dir"
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" > "$key_dir/AuthKey.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey.p8" >> "$GITHUB_ENV"

          proj=$(find upstream/build -maxdepth 2 -name '*.xcodeproj' | head -1)
          [ -n "$proj" ] || { echo "::error::找不到生成的 Xcode 工程"; exit 1; }
          scheme=$(xcodebuild -list -json -project "$proj" | jq -r --arg p "$PLATFORM" '.project.schemes[] | select(test($p))' | head -1)
          if [ -z "$scheme" ]; then
            xcodebuild -list -project "$proj"
            echo "::error::找不到 $PLATFORM scheme"; exit 1
          fi
          echo "PROJ=$proj" >> "$GITHUB_ENV"
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          # 构建号用时间戳，保证每次上传都比上一次大（同一版本号重复上传时也不会冲突）
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "Project: $proj / Scheme: $scheme"

      # Archive 阶段由自动签名使用开发证书签名，需要证书私钥；
      # 导出上传阶段的发布证书由 API Key 的云端签名负责。
      - name: Import development certificate
        env:
          P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw=$(openssl rand -base64 24)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.p12"

          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/dev.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pw" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dev.p12"

          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "导入的签名身份："
          security find-identity -v -p codesigning "$keychain"

      # 新版 Xcode 把描述文件放在 UserData 目录，旧位置是 MobileDevice 目录。
      # 命令行用 API Key 下载描述文件时，写入和读取的位置可能不一致，
      # 导致 "Build input file cannot be found: .../Provisioning Profiles/xxx.mobileprovision"。
      # 让两个路径指向同一个目录，无论 Xcode 用哪一个都能找到。
      - name: Unify provisioning profile directories
        run: |
          legacy="$HOME/Library/MobileDevice/Provisioning Profiles"
          current="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$legacy" "$(dirname "$current")"
          if [ -d "$current" ] && [ ! -L "$current" ]; then
            cp -n "$current"/* "$legacy"/ 2>/dev/null || true
            rm -rf "$current"
          fi
          ln -sfn "$legacy" "$current"
          ls -la "$(dirname "$current")"
          xcodebuild -version

      - name: Archive
        run: |
          archive() {
            xcodebuild archive \
              -project "$PROJ" \
              -scheme "$SCHEME" \
              -destination "generic/platform=${PLATFORM}" \
              -archivePath "$RUNNER_TEMP/app.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          }

          if archive; then exit 0; fi

          # 第一次失败时打印描述文件目录，再重试一次（此时描述文件通常已下载到磁盘）
          echo "::warning::Archive 第一次失败，打印描述文件目录后重试"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            echo "== $d"; ls -la "$d" 2>&1 || true
          done
          rm -rf "$RUNNER_TEMP/app.xcarchive"
          archive

      - name: Export & upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"; then
            # 真正的失败原因在 .xcdistributionlogs 里；打印前去掉 token / Authorization 头
            for f in "${TMPDIR:-/tmp}"/*.xcdistributionlogs/*.log; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$f")"
              grep -v -i 'authorization' "$f" | sed -E 's/(Bearer |eyJ)[A-Za-z0-9._-]+/\1<redacted>/g' | tail -300
              echo "::endgroup::"
            done
            exit 1
          fi

          echo "### 已上传 ${PLATFORM} ${TAG}（build ${BUILD_NUMBER}）到 TestFlight" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing key & keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/dev.p12"
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true

  # 所有平台都上传成功后才记录状态；任一平台失败，第二天会自动重试
  record:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Save state
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          mkdir -p .state
          echo "$TAG" > .state/last-built
          date +%s > .state/last-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state
          git commit -m "testflight: ${TAG}"
          git pull --rebase
          git push
