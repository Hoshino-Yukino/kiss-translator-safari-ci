name: ASC diagnose (temporary)

# 临时的只读诊断：用 App Store Connect API 查看账号状态，确认根因后删除。
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/asc-diagnose.yml', '.github/scripts/asc_diagnose.py']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography
      - name: Query App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          ASC_KEY_PATH="$key" python3 .github/scripts/asc_diagnose.py \
            "online.swqh.KISS-Translator" "online.swqh.KISS-Translator.Extension" \
            "$BUNDLE_ID" "${BUNDLE_ID}.Extension"
          rm -f "$key"
